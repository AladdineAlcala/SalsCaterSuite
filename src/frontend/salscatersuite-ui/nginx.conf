# ---------------------------------------------------------------------------
# The SPA and the API share one origin, so the browser never issues a CORS
# pre-flight: `apiClient` calls `/api/...` and this server forwards it.
#
# proxy_pass carries NO URI part, so the original request path is preserved
# (`/api/packages?areaId=3` reaches the API unchanged).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API. Upgrade headers are kept so a SignalR connection can negotiate.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Static assets are content-hashed by Vite, so they may be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/bookings, /packages, ...) must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
